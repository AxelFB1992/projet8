version: 2

models:
  - name: dim_weather_stations
    description: "Table de dimension des stations météorologiques (InfoClimat et Weather Underground)"
    columns:
      - name: station_id
        description: "Identifiant unique de la station"
        data_tests:
          - unique
          - not_null
      - name: station_name
        description: "Nom de la station"
        data_tests:
          - not_null
      - name: network
        description: "Réseau d'appartenance de la station"
        data_tests:
          - not_null
          - accepted_values:
                arguments:
                    values: ['infoclimat', 'weather_underground']
      - name: latitude
        description: "Latitude de la station"
        data_tests:
          - not_null
      - name: longitude
        description: "Longitude de la station"
        data_tests:
          - not_null
      - name: country
        description: "Pays de la station"
        data_tests:
          - accepted_values:
                arguments:
                    values: ['France', 'Belgique']

